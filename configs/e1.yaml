# Protokol korpus penuh E1 (Phase 4, execution-plan.md). Mengikuti rencana analisis yang dibekukan
# di G2 (analysis-plan.md, ADR 0011): grid korupsi 1.0.0 (45 tunggal + 10 campuran final dari
# configs/corruption.yaml), 5 seed per konfigurasi, noise floor terukur 10 seed, noise floor
# estimasi 5 seed probe (G2-1), baseline (d) pada seed index 0 (G2-7), dan ablation campuran
# untuk H2b (ADR 0006) pada kelima seed.
version: "1.0.0"
