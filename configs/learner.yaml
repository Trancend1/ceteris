# Spesifikasi learner acuan (BR-03). DRAF Phase 1; dibekukan di G1, perubahan sesudahnya = versi baru.
# Nilai di bawah adalah default LightGBM, ditambah pengaturan determinisme.
# objective, num_class, dan seed diatur oleh harness (ceteris.train), bukan di berkas ini.
version: "0.1.0-draft"
num_boost_round: 100
params:
  learning_rate: 0.1
  num_leaves: 31
  min_data_in_leaf: 20
  deterministic: true
  force_row_wise: true
  num_threads: 1
  verbosity: -1
