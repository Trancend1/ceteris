        <title id="pipeline-eksperimen-title">Alur data offline ke online</title>
        <desc id="pipeline-eksperimen-desc">Data mengalir dari korpus OpenML-CC18 melalui korupsi terkontrol, pelatihan, dan quality profile ke run store dan evaluasi LODO yang menjawab RQ1–RQ3, lalu artefak model yang sama dipakai ceteris scan pada data kotor asli untuk RQ4.</desc>
