        <title id="arsitektur-kontainer-title">Arsitektur kontainer Ceteris</title>
        <desc id="arsitektur-kontainer-desc">Klien web dan SDK memanggil API, API mengantrikan job ke worker yang memuat artefak model dari registry, membaca data dari object store atau warehouse, dan menulis hasil ke Postgres.</desc>
