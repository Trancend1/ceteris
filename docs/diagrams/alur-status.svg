<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 708" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="alur-status-title alur-status-desc" id="alur-status-root">
        <title id="alur-status-title">Penentuan status hasil scan</title>
        <desc id="alur-status-desc">Scan yang lolos kontrak input mendapat estimasi dan ambang T; skor OOD tinggi atau interval yang memotong T menghasilkan status tidak yakin, interval seluruhnya di atas T menghasilkan material, dan seluruhnya di bawah T menghasilkan tidak material.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #alur-status-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #alur-status-root { font-family: var(--font-sans); color: var(--color-ink); }
      #alur-status-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#alur-status-root .diagram-container { overflow-x: visible; }
}</style>
