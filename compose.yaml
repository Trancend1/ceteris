# Ceteris R1 self-host kecil (architecture.md 10; ADR 0016 K2, ADR 0018).
# Kredensial di bawah hanya untuk pengembangan lokal. Ganti lewat berkas .env sebelum dipakai
# tim; jangan commit .env (NFR-5).
name: ceteris

x-ceteris-env: &ceteris-env
  CETERIS_DATABASE_URL: postgresql+pg8000://${POSTGRES_USER:-ceteris}:${POSTGRES_PASSWORD:-ceteris-dev}@postgres:5432/${POSTGRES_DB:-ceteris}
  CETERIS_REDIS_URL: redis://redis:6379/0
  CETERIS_OBJECT_STORE: s3://${CETERIS_BUCKET:-ceteris}
  CETERIS_S3_ENDPOINT: minio:9000
  CETERIS_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-ceteris}
  CETERIS_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-ceteris-dev-secret}
  CETERIS_S3_SECURE: "false"
  CETERIS_ARTIFACT_VERSION: ${CETERIS_ARTIFACT_VERSION:-}
  CETERIS_ARTIFACT_CACHE: /tmp/ceteris-artifacts

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ceteris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ceteris-dev}
      POSTGRES_DB: ${POSTGRES_DB:-ceteris}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ceteris}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ceteris-dev-secret}
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${CETERIS_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ceteris}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ceteris-dev-secret}
      CETERIS_BUCKET: ${CETERIS_BUCKET:-ceteris}

  api:
    build: {context: ., dockerfile: docker/Dockerfile}
    environment: *ceteris-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    volumes: ["./artifacts:/artifacts:ro"]

  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["rq", "worker", "scans", "--url", "redis://redis:6379/0"]
    environment: *ceteris-env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

volumes:
  postgres-data:
  minio-data:
