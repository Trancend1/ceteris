[project]
name = "ceteris"
version = "0.0.0"
description = "Data quality intelligence: menaksir seberapa besar kekotoran data merugikan hasil."
readme = "AGENTS.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "cleanlab>=2.8.0,<3",
]

[project.scripts]
ceteris = "ceteris.scan:app"

[project.optional-dependencies]
server = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "minio>=7.2",
    "pg8000>=1.31",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "rq>=2.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "schemathesis>=3.30",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "papermill>=2.6",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceteris", "server/ceteris_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "server"]
addopts = "-ra --strict-markers -m 'not network and not integration and not load'"
markers = [
    "network: uji yang menghubungi OpenML; jalankan manual dengan -m network",
    "integration: uji dengan Postgres, Redis, dan object store S3 sungguhan (Docker Compose)",
    "load: uji beban NFR-1; jalankan manual dengan -m load",
]

[tool.coverage.run]
source = ["ceteris"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI memakai pemanggilan ini sebagai nilai bawaan parameter dependensi.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Form", "fastapi.File"]

[tool.ruff.lint.isort]
known-first-party = ["ceteris", "ceteris_server", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ceteris", "server/ceteris_server"]
mypy_path = "server"

[[tool.mypy.overrides]]
# Pustaka tanpa anotasi tipe; diperlakukan sebagai Any (ADR 0004).
module = ["pandas.*", "sklearn.*", "lightgbm.*", "pyarrow.*", "yaml.*", "scipy.*", "cleanlab.*", "statsmodels.*", "rq.*", "minio.*", "fakeredis.*", "schemathesis.*"]
ignore_missing_imports = true
