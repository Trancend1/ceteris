[project]
name = "ceteris"
version = "0.0.0"
description = "Data quality intelligence: menaksir seberapa besar kekotoran data merugikan hasil."
readme = "AGENTS.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "typer>=0.12",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "papermill>=2.6",
    "nbstripout>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ceteris"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ceteris"]
